[tool.poetry]
name = "kyun-ginara-project"
version = "0.1.0"
description = "Kyun Ginara Project - FastAPI and LangChain application"
authors = ["DoeunKongden <doeunkongden1@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.118.0"
uvicorn = {extras = ["standard"], version = "^0.37.0"}
pydantic = "^2.11.9"
langchain-huggingface = "^0.3.1"
langchain = "^0.3.27"
transformers = "^4.56.2"
torch = "^2.0.0"
psycopg2-binary = "^2.9.10"
python-dotenv = "^1.1.1"
# For GGUF models
llama-cpp-python = "^0.2.0"
protobuf = "^6.32.1"
accelerate = "^1.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
